name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'rust-sdk/**/*.md'
      - 'typescript-sdk/**/*.md'
      - 'README.md'
      - 'API_DOCUMENTATION.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Build documentation site
        run: |
          mkdir -p _site

          # Copy markdown files (Jekyll will render them as HTML)
          cp README.md _site/index.md
          cp API_DOCUMENTATION.md _site/

          # Copy SDK documentation
          mkdir -p _site/rust-sdk _site/typescript-sdk
          cp rust-sdk/README.md _site/rust-sdk/
          cp typescript-sdk/README.md _site/typescript-sdk/

          # Create Jekyll config for GitHub Pages
          cat > _site/_config.yml << 'EOF'
          theme: jekyll-theme-cayman
          title: X (Twitter) SDKs
          description: Dual-language SDKs for Twitter/X API v2 with OAuth 1.0a
          show_downloads: false
          github:
            repository_url: https://github.com/0xCryptoZen/x-sdks
            is_project_page: true
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
