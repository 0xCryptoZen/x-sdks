name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'rust-sdk/**/*.md'
      - 'typescript-sdk/**/*.md'
      - 'README.md'
      - 'API_DOCUMENTATION.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Build documentation site
        run: |
          mkdir -p _site

          # Copy markdown files as-is for now (we'll use Jekyll to render them)
          cp README.md _site/index.md
          cp API_DOCUMENTATION.md _site/

          # Copy SDK documentation
          mkdir -p _site/rust-sdk _site/typescript-sdk
          cp rust-sdk/README.md _site/rust-sdk/
          cp typescript-sdk/README.md _site/typescript-sdk/

          # Create Jekyll config for GitHub Pages
          cat > _site/_config.yml << 'EOF'
          theme: jekyll-theme-cayman
          title: X (Twitter) SDKs
          description: Dual-language SDKs for Twitter/X API v2 with OAuth 1.0a
          show_downloads: false
          github:
            repository_url: https://github.com/0xCryptoZen/x-sdks
            is_project_page: true
          EOF

          # Create a simple index.html that redirects to rendered markdown
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <meta http-equiv="refresh" content="0; url=./index.md">
              <title>X SDKs Documentation</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      height: 100vh;
                      margin: 0;
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                  }
                  .container {
                      text-align: center;
                  }
                  h1 { font-size: 3em; margin-bottom: 20px; }
                  p { font-size: 1.2em; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🚀 X SDKs</h1>
                  <p>Redirecting to documentation...</p>
              </div>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
