name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'rust-sdk/**/*.md'
      - 'typescript-sdk/**/*.md'
      - 'README.md'
      - 'API_DOCUMENTATION.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Install dependencies
        run: |
          npm install -g markdown-it markdown-it-anchor markdown-it-toc-done-right

      - name: Build documentation site
        run: |
          mkdir -p docs/_site

          # Copy all markdown files
          cp README.md docs/_site/index.md
          cp API_DOCUMENTATION.md docs/_site/

          # Copy SDK documentation
          mkdir -p docs/_site/rust-sdk docs/_site/typescript-sdk
          cp rust-sdk/README.md docs/_site/rust-sdk/
          cp typescript-sdk/README.md docs/_site/typescript-sdk/

      - name: Generate HTML from Markdown
        run: |
          cd docs/_site

          # Create HTML template
          cat > template.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>X SDKs Documentation</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      line-height: 1.6;
                      color: #333;
                      background: #f5f5f5;
                  }
                  .container {
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 20px;
                      background: white;
                      min-height: 100vh;
                      box-shadow: 0 0 20px rgba(0,0,0,0.1);
                  }
                  header {
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      padding: 40px 20px;
                      margin: -20px -20px 40px -20px;
                      border-radius: 0 0 10px 10px;
                  }
                  header h1 {
                      font-size: 2.5em;
                      margin-bottom: 10px;
                  }
                  nav {
                      background: #f8f9fa;
                      padding: 15px;
                      margin-bottom: 30px;
                      border-radius: 8px;
                      border-left: 4px solid #667eea;
                  }
                  nav a {
                      color: #667eea;
                      text-decoration: none;
                      margin-right: 20px;
                      font-weight: 600;
                  }
                  nav a:hover {
                      text-decoration: underline;
                  }
                  .content {
                      padding: 20px;
                  }
                  h1, h2, h3, h4, h5, h6 {
                      margin-top: 1.5em;
                      margin-bottom: 0.5em;
                      color: #2c3e50;
                  }
                  h1 { font-size: 2.5em; border-bottom: 3px solid #667eea; padding-bottom: 10px; }
                  h2 { font-size: 2em; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }
                  h3 { font-size: 1.5em; }
                  code {
                      background: #f4f4f4;
                      padding: 2px 6px;
                      border-radius: 3px;
                      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
                      font-size: 0.9em;
                  }
                  pre {
                      background: #2d2d2d;
                      color: #f8f8f2;
                      padding: 20px;
                      border-radius: 8px;
                      overflow-x: auto;
                      margin: 1em 0;
                  }
                  pre code {
                      background: transparent;
                      color: inherit;
                      padding: 0;
                  }
                  table {
                      width: 100%;
                      border-collapse: collapse;
                      margin: 1em 0;
                  }
                  th, td {
                      padding: 12px;
                      border: 1px solid #ddd;
                      text-align: left;
                  }
                  th {
                      background: #667eea;
                      color: white;
                      font-weight: 600;
                  }
                  tr:nth-child(even) {
                      background: #f9f9f9;
                  }
                  a {
                      color: #667eea;
                      text-decoration: none;
                  }
                  a:hover {
                      text-decoration: underline;
                  }
                  blockquote {
                      border-left: 4px solid #667eea;
                      padding-left: 20px;
                      margin: 1em 0;
                      color: #666;
                      font-style: italic;
                  }
                  img {
                      max-width: 100%;
                      height: auto;
                      border-radius: 8px;
                      margin: 1em 0;
                  }
                  .badge {
                      display: inline-block;
                      padding: 4px 8px;
                      border-radius: 4px;
                      font-size: 0.85em;
                      font-weight: 600;
                      margin-right: 5px;
                  }
                  .badge-success { background: #28a745; color: white; }
                  .badge-info { background: #17a2b8; color: white; }
                  .badge-warning { background: #ffc107; color: #333; }
                  footer {
                      margin-top: 60px;
                      padding: 30px 20px;
                      background: #f8f9fa;
                      text-align: center;
                      border-radius: 8px;
                      color: #666;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <header>
                      <h1>🚀 X (Twitter) SDKs</h1>
                      <p>Dual-language SDKs for Twitter/X API v2</p>
                  </header>

                  <nav>
                      <a href="index.html">Home</a>
                      <a href="API_DOCUMENTATION.html">API Reference</a>
                      <a href="rust-sdk/README.html">Rust SDK</a>
                      <a href="typescript-sdk/README.html">TypeScript SDK</a>
                      <a href="https://github.com/0xCryptoZen/x-sdks" target="_blank">GitHub</a>
                  </nav>

                  <div class="content">
                      {{CONTENT}}
                  </div>

                  <footer>
                      <p>Built with ❤️ using <a href="https://claude.com/claude-code">Claude Code</a></p>
                      <p>© 2025 X SDKs Project | <a href="https://github.com/0xCryptoZen/x-sdks">View on GitHub</a></p>
                  </footer>
              </div>
          </body>
          </html>
          EOF

          # Convert markdown files to HTML
          for md_file in $(find . -name "*.md"); do
              html_file="${md_file%.md}.html"
              markdown-it "$md_file" > temp_content.html
              sed "s|{{CONTENT}}|$(cat temp_content.html | sed 's/&/\\&/g')|" template.html > "$html_file"
              rm temp_content.html
              echo "Generated: $html_file"
          done

          rm template.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
