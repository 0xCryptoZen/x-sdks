name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'rust-sdk/**/*.md'
      - 'typescript-sdk/**/*.md'
      - 'README.md'
      - 'API_DOCUMENTATION.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Build documentation site
        run: |
          # Create docs structure in root
          cp README.md index.md

          # Create Jekyll config
          cat > _config.yml << 'EOF'
          theme: jekyll-theme-cayman
          title: X (Twitter) SDKs
          description: Dual-language SDKs for Twitter/X API v2 with OAuth 1.0a
          show_downloads: false
          github:
            repository_url: https://github.com/0xCryptoZen/x-sdks
            is_project_page: true
          plugins:
            - jekyll-relative-links
          relative_links:
            enabled: true
            collections: true
          include:
            - API_DOCUMENTATION.md
            - rust-sdk/README.md
            - typescript-sdk/README.md
          EOF

          # Install Jekyll, theme, and build
          gem install jekyll bundler jekyll-theme-cayman jekyll-relative-links
          jekyll build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
