[workspace]
members = ["x-sdk"]
resolver = "2"

[workspace.package]
version = "2.0.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/0xCryptoZen/x-sdks"
authors = ["X-SDKs Contributors"]

[workspace.dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
oauth1-request = "0.6"
thiserror = "1.0"
